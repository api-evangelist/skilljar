openapi: 3.2.0
info:
  title: Skilljar Users > Groups API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Users > Groups
paths:
  /v1/users/{user_id}/groups:
    get:
      operationId: users_groups_list
      description: 'List groups for a user.


        Returns a list of all groups that the user is a member of.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Users > Groups
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupMembershipList'
          description: ''
      summary: Users groups list
      x-summary-source: derived
components:
  schemas:
    GroupMembershipGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    PaginatedGroupMembershipList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/GroupMembership'
    GroupMembership:
      type: object
      properties:
        id:
          type: string
        group:
          $ref: '#/components/schemas/GroupMembershipGroup'
        joined_at:
          type: string
          format: date-time
          description: Datetime at which the user was added to the group
      required:
      - group
      - id
      - joined_at
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
