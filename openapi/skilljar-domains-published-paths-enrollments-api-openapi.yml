openapi: 3.2.0
info:
  title: Skilljar Domains > Published Paths > Enrollments API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Domains > Published Paths > Enrollments
paths:
  /v1/domains/{domain_name}/published-paths/{published_path_id}/published-path-enrollments:
    get:
      operationId: domains_published_paths_published_path_enrollments_list
      description: 'List enrollments for a Published Path.


        Returns a paginated list of enrollments for the specified Published Path, including user and purchase details.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: published_path_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Paths > Enrollments
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublishedPathEnrollmentList'
          description: ''
      summary: Domains published paths published path enrollments list
      x-summary-source: derived
    post:
      operationId: domains_published_paths_published_path_enrollments_create
      description: 'Enroll a user in a Published Path.


        This operation is idempotent for the same user and enrollment time.

        Only users with an existing domain membership can be enrolled.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_path_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Paths > Enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublishedPathEnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePublishedPathEnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePublishedPathEnrollmentRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePublishedPathEnrollment'
          description: ''
      summary: Domains published paths published path enrollments create
      x-summary-source: derived
  /v1/domains/{domain_name}/published-paths/{published_path_id}/published-path-enrollments/{published_path_enrollment_id}:
    get:
      operationId: domains_published_paths_published_path_enrollments_retrieve
      description: 'Retrieve details for a Published Path enrollment.


        Returns enrollment information, including user details and purchase information if applicable.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_path_enrollment_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      - in: path
        name: published_path_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Paths > Enrollments
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedPathEnrollment'
          description: ''
      summary: Domains published paths published path enrollments retrieve
      x-summary-source: derived
    put:
      operationId: domains_published_paths_published_path_enrollments_update
      description: 'Manage enrollments for a Published Path.


        Enrollments represent a user''s access to a Published Path.

        This API allows you to list, retrieve, create, and update enrollments for a specific Published Path.


        Enrollment states:

        - A user may have multiple enrollments for a path.

        - Access is granted if at least one enrollment is active and not expired.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_path_enrollment_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      - in: path
        name: published_path_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Paths > Enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublishedPathEnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdatePublishedPathEnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdatePublishedPathEnrollmentRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePublishedPathEnrollment'
          description: ''
      summary: Domains published paths published path enrollments update
      x-summary-source: derived
    patch:
      operationId: domains_published_paths_published_path_enrollments_partial_update
      description: 'Manage enrollments for a Published Path.


        Enrollments represent a user''s access to a Published Path.

        This API allows you to list, retrieve, create, and update enrollments for a specific Published Path.


        Enrollment states:

        - A user may have multiple enrollments for a path.

        - Access is granted if at least one enrollment is active and not expired.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_path_enrollment_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      - in: path
        name: published_path_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Paths > Enrollments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdatePublishedPathEnrollmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdatePublishedPathEnrollmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdatePublishedPathEnrollmentRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePublishedPathEnrollment'
          description: ''
      summary: Domains published paths published path enrollments partial update
      x-summary-source: derived
components:
  schemas:
    PurchaseOfferPrice:
      type: object
      properties:
        amount:
          type: string
          default: '0.00'
        currency_code:
          type: string
          default: USD
    Price:
      type: object
      properties:
        amount:
          type: string
          default: '0.00'
        currency_code:
          type: string
          default: USD
    PatchedUpdatePublishedPathEnrollmentRequest:
      type: object
      properties:
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        active:
          type: boolean
    UpdatePublishedPathEnrollment:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/ReadOnlyUser'
          readOnly: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        active:
          type: boolean
        purchase:
          allOf:
          - $ref: '#/components/schemas/EnrollmentPurchase'
          readOnly: true
    PublishedPathEnrollment:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user:
          $ref: '#/components/schemas/ReadOnlyUser'
        enrolled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        active:
          type:
          - boolean
          - 'null'
          default: true
        purchase:
          allOf:
          - $ref: '#/components/schemas/EnrollmentPurchase'
          readOnly: true
      required:
      - user
    CreatePublishedPathEnrollment:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user:
          $ref: '#/components/schemas/ReadOnlyUser'
        enrolled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        active:
          type:
          - boolean
          - 'null'
          default: true
        purchase:
          allOf:
          - $ref: '#/components/schemas/EnrollmentPurchase'
      required:
      - user
    PaginatedPublishedPathEnrollmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublishedPathEnrollment'
    CreatePublishedPathEnrollmentRequest:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/ReadOnlyUserRequest'
        enrolled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        active:
          type:
          - boolean
          - 'null'
          default: true
        purchase:
          allOf:
          - $ref: '#/components/schemas/EnrollmentPurchaseRequest'
      required:
      - user
    EnrollmentPurchaseRequest:
      type: object
      properties:
        purchase_price:
          $ref: '#/components/schemas/PriceRequest'
        purchase_state:
          $ref: '#/components/schemas/PurchaseStateEnum'
        purchased_at:
          type: string
          format: date-time
        tax_price_cents:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
    ReadOnlyUserRequest:
      type: object
      description: Version of the user serializer configured to lookup a user given the user's id.  It will not create new users.
      properties:
        id:
          type: string
          minLength: 1
          description: Known as user_id within the documentation
      required:
      - id
    UpdatePublishedPathEnrollmentRequest:
      type: object
      properties:
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        active:
          type: boolean
    EnrollmentPurchase:
      type: object
      properties:
        order_id:
          type: string
          readOnly: true
        offer_price:
          allOf:
          - $ref: '#/components/schemas/PurchaseOfferPrice'
          readOnly: true
        purchase_price:
          $ref: '#/components/schemas/Price'
        quantity:
          type: integer
          readOnly: true
        purchase_state:
          $ref: '#/components/schemas/PurchaseStateEnum'
        payment_processor:
          allOf:
          - $ref: '#/components/schemas/PaymentProcessorEnum'
          readOnly: true
          default: NONE
        purchase_id:
          type: string
          readOnly: true
        purchased_at:
          type: string
          format: date-time
        tax_price_cents:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
    ReadOnlyUser:
      type: object
      description: Version of the user serializer configured to lookup a user given the user's id.  It will not create new users.
      properties:
        id:
          type: string
          description: Known as user_id within the documentation
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Email address
        first_name:
          type: string
          readOnly: true
          description: First name
        last_name:
          type: string
          readOnly: true
          description: Last name
      required:
      - id
    PurchaseStateEnum:
      enum:
      - CREATED
      - SUCCESS
      - FAILED
      - REFUNDED
      - CANCELLED
      - FLAGGED
      - PENDING
      type: string
      description: '* `CREATED` - CREATED

        * `SUCCESS` - SUCCESS

        * `FAILED` - FAILED

        * `REFUNDED` - REFUNDED

        * `CANCELLED` - CANCELLED

        * `FLAGGED` - FLAGGED

        * `PENDING` - PENDING'
    PaymentProcessorEnum:
      enum:
      - NONE
      - STRIPE
      - STRIPE_BTC
      - PAYPAL
      - PAYFLOW
      - CYBERSRC
      - MES
      - EXTERNAL
      type: string
      description: '* `NONE` - None

        * `STRIPE` - Stripe

        * `STRIPE_BTC` - Stripe Bitcoin

        * `PAYPAL` - PayPal

        * `PAYFLOW` - Payflow

        * `CYBERSRC` - Cybersource

        * `MES` - Merchant e-Solutions

        * `EXTERNAL` - External'
    PriceRequest:
      type: object
      properties:
        amount:
          type: string
          minLength: 1
          default: '0.00'
        currency_code:
          type: string
          minLength: 1
          default: USD
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
