openapi: 3.2.0
info:
  title: Skilljar Tags API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Tags
paths:
  /v1/tags:
    get:
      operationId: tags_list
      description: List Tags. Returns a paginated list (1000 results per page) of Tags.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Tags
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTagList'
          description: ''
      summary: Tags list
      x-summary-source: derived
    post:
      operationId: tags_create
      description: Creates a new `Tag`.
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
      summary: Tags create
      x-summary-source: derived
  /v1/tags/{tag_id}:
    get:
      operationId: tags_retrieve
      description: Get Tag details.
      parameters:
      - in: path
        name: tag_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Tags
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
      summary: Tags retrieve
      x-summary-source: derived
    put:
      operationId: tags_update
      description: Update Tag details. PUT and PATCH are identical - both do partial updates.
      parameters:
      - in: path
        name: tag_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
      summary: Tags update
      x-summary-source: derived
    patch:
      operationId: tags_partial_update
      description: Update Tag details. PUT and PATCH are identical - both do partial updates.
      parameters:
      - in: path
        name: tag_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTagRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
      summary: Tags partial update
      x-summary-source: derived
    delete:
      operationId: tags_destroy
      parameters:
      - in: path
        name: tag_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Tags
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      summary: Tags destroy
      x-summary-source: derived
components:
  schemas:
    PatchedTagRequest:
      type: object
      description: Serializer for Tag model.
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the tag.  This is a required field and must be unique within the organization.
          maxLength: 255
    Tag:
      type: object
      description: Serializer for Tag model.
      properties:
        id:
          type: string
          readOnly: true
          description: Known as tag_id within the documentation
        name:
          type: string
          description: Name of the tag.  This is a required field and must be unique within the organization.
          maxLength: 255
        slug:
          type: string
          readOnly: true
          description: The slug can only contain lowercase letters, numbers and dashes.
          maxLength: 255
      required:
      - name
    TagRequest:
      type: object
      description: Serializer for Tag model.
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the tag.  This is a required field and must be unique within the organization.
          maxLength: 255
      required:
      - name
    PaginatedTagList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
