      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      summary: Domains published courses student group prerequisites destroy
      x-summary-source: derived
components:
  schemas:
    StudentGroupSummary:
      type: object
      description: Serializer for student groups for use GroupVisibility serializers
      properties:
        id:
          type: string
        name:
          type: string
          readOnly: true
      required:
      - id
    PublishedCourseStudentGroupPrerequisiteRequest:
      type: object
      description: Serializer for PublishedCourseStudentGroupPrerequisite
      properties:
        student_group:
          $ref: '#/components/schemas/StudentGroupSummaryRequest'
      required:
      - student_group
    PublishedCourseStudentGroupPrerequisite:
      type: object
      description: Serializer for PublishedCourseStudentGroupPrerequisite
      properties:
        student_group:
          $ref: '#/components/schemas/StudentGroupSummary'
      required:
      - student_group
    PaginatedPublishedCourseStudentGroupPrerequisiteList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublishedCourseStudentGroupPrerequisite'
    StudentGroupSummaryRequest:
      type: object
      description: Serializer for student groups for use GroupVisibility serializers
      properties:
        id:
          type: string
          minLength: 1
      required:
      - id
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
