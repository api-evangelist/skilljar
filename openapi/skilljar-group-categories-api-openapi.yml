openapi: 3.2.0
info:
  title: Skilljar Group Categories API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Group Categories
paths:
  /v1/group-categories:
    get:
      operationId: group_categories_list
      description: 'List all group categories.


        Returns a paginated list of group categories that can be used to organize student groups.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Group Categories
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupCategoryList'
          description: ''
      summary: Group categories list
      x-summary-source: derived
  /v1/group-categories/{group_category_id}:
    get:
      operationId: group_categories_retrieve
      description: 'Retrieve a specific group category by its ID.


        Returns details for a single group category.'
      parameters:
      - in: path
        name: group_category_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Group Categories
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCategory'
          description: ''
      summary: Group categories retrieve
      x-summary-source: derived
components:
  schemas:
    PaginatedGroupCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/GroupCategory'
    GroupCategory:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
      required:
      - name
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
