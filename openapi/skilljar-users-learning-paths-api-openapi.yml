openapi: 3.2.0
info:
  title: Skilljar Users > Learning Paths API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Users > Learning Paths
paths:
  /v1/users/{user_id}/published-path-enrollments:
    get:
      operationId: users_published_path_enrollments_list
      description: 'List Learning Path enrollments for a user.


        Returns a list of Learning Path enrollments and progress details for the user.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Users > Learning Paths
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublishedPathEnrollments'
          description: ''
      summary: Users published path enrollments list
      x-summary-source: derived
components:
  schemas:
    StudentPathProgress:
      type: object
      properties:
        path_progress_id:
          type: string
          readOnly: true
        completed_course_count:
          type: integer
          readOnly: true
        completed_required_course_count:
          type: integer
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        latest_activity:
          type: string
          format: date-time
          readOnly: true
    UserPublishedPathSummary:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        course_count:
          type: integer
          readOnly: true
    UserPublishedPathEnrollments:
      type: object
      properties:
        published_path_id:
          type: string
          description: ID of the PublishedPath
        domain_name:
          type: string
          readOnly: true
          description: Domain name where the path is published.
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
          description: Datetime the user most recently enrolled in the path
        expires_at:
          type: string
          format: date-time
          readOnly: true
        active:
          type: boolean
          readOnly: true
        enrollment_id:
          type: string
          readOnly: true
          description: ID of the Enrollment
        published_path:
          $ref: '#/components/schemas/UserPublishedPathSummary'
        published_path_progress:
          $ref: '#/components/schemas/StudentPathProgress'
      required:
      - published_path
      - published_path_progress
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
