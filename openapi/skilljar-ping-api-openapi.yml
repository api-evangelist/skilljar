openapi: 3.2.0
info:
  title: Skilljar Ping API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Ping
paths:
  /v1/ping:
    get:
      operationId: ping_retrieve
      description: Ping the API endpoint. HTTP 2xx responses indicate a successful authentication with the Skilljar API endpoint.
      summary: Ping API
      tags:
      - Ping
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
