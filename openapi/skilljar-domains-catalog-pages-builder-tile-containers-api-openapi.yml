          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TileContainerContentBlockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TileContainerContentBlockRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
