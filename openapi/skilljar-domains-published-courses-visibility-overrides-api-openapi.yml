openapi: 3.2.0
info:
  title: Skilljar Domains > Published Courses > Visibility Overrides…
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Domains > Published Courses > Visibility Overrides
paths:
  /v1/domains/{domain_name}/published-courses/{published_course_id}/visibility-overrides:
    get:
      operationId: domains_published_courses_visibility_overrides_list
      description: List StudentGroup visibility overrides for PublishedCourse.
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: published_course_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Courses > Visibility Overrides
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublishedCourseGroupVisibilityList'
          description: ''
      summary: Domains published courses visibility overrides list
      x-summary-source: derived
    post:
      operationId: domains_published_courses_visibility_overrides_create
      description: Create StudentGroup visibility override for a PublishedCourse
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_course_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Courses > Visibility Overrides
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishedCourseGroupVisibilityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublishedCourseGroupVisibilityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublishedCourseGroupVisibilityRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCourseGroupVisibility'
          description: ''
      summary: Domains published courses visibility overrides create
      x-summary-source: derived
  /v1/domains/{domain_name}/published-courses/{published_course_id}/visibility-overrides/{student_group_id}:
    get:
      operationId: domains_published_courses_visibility_overrides_retrieve
      description: Retrieve StudentGroup visibility override for PublishedCourse.
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_course_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      - in: path
        name: student_group_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Courses > Visibility Overrides
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCourseGroupVisibility'
          description: ''
      summary: Domains published courses visibility overrides retrieve
      x-summary-source: derived
    delete:
      operationId: domains_published_courses_visibility_overrides_destroy
      description: Deletes a StudentGroup visibility override for a PublishedCourse and returns a `204` response.
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: published_course_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      - in: path
        name: student_group_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Published Courses > Visibility Overrides
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      summary: Domains published courses visibility overrides destroy
      x-summary-source: derived
components:
  schemas:
    StudentGroupSummary:
      type: object
      description: Serializer for student groups for use GroupVisibility serializers
      properties:
        id:
          type: string
        name:
          type: string
          readOnly: true
      required:
      - id
    PaginatedPublishedCourseGroupVisibilityList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublishedCourseGroupVisibility'
    PublishedCourseGroupVisibilityRequest:
      type: object
      description: Serializer for PublishedCourseGroupVisibility overrides
      properties:
        student_group:
          $ref: '#/components/schemas/StudentGroupSummaryRequest'
        is_visible:
          type: boolean
      required:
      - is_visible
      - student_group
    PublishedCourseGroupVisibility:
      type: object
      description: Serializer for PublishedCourseGroupVisibility overrides
      properties:
        student_group:
          $ref: '#/components/schemas/StudentGroupSummary'
        is_visible:
          type: boolean
      required:
      - is_visible
      - student_group
    StudentGroupSummaryRequest:
      type: object
      description: Serializer for student groups for use GroupVisibility serializers
      properties:
        id:
          type: string
          minLength: 1
      required:
      - id
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
