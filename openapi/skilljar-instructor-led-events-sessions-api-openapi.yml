    IltSessionRequest:
      type: object
      description: 'This serializer is a combination of ViltSession & ViltSessionEvent fields


        Create/Update will write to fields for each model respectively from a flat JSON payload'
      properties:
        instructor_email:
          type: string
          minLength: 1
          description: Instructor email, can be provided either as <code>instructor@example.com</code> or <code>Instructor Name &lt;instructor@example.com&gt;</code> for events without a provider.
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          default: calendar
          description: 'The session provider. Can be one of <code>calendar</code>, <code>goto.meeting</code>, <code>goto.training</code>, <code>goto.webinar</code>, <code>goto.webcast</code>, <code>webex.meeting</code>, <code>webex.webinar</code>, <code>zoom.meeting</code>, <code>zoom.webinar</code>. Defaults to <code>calendar</code>.


            * `calendar` - calendar

            * `goto.meeting` - goto.meeting

            * `goto.training` - goto.training

            * `goto.webinar` - goto.webinar

            * `goto.webcast` - goto.webcast

            * `webex.meeting` - webex.meeting

            * `webex.webinar` - webex.webinar

            * `zoom.meeting` - zoom.meeting

            * `zoom.webinar` - zoom.webinar'
        lesson:
          type: string
          description: The Lesson that this ViltSessionEvent belongs to. It is required to set either this or <code>multi_session_event</code>.
        multi_session_event:
          type: string
          description: The MultiSessionEvent that this ViltSessionEvent belongs to. It is required to set either this or <code>lesson</code>.
        display_name:
          type: string
          minLength: 1
          title: Event name
          description: The title of the event
          maxLength: 200
        starts_at:
          type: string
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the start of the event is scheduled
        ends_at:
          type: string
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the end of the event is scheduled
