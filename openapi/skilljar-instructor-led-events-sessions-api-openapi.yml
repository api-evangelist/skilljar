openapi: 3.0.3
info:
  title: Skilljar Assets Instructor Led Events > Sessions API
  version: 1.0.0
  description: 'The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.


    This interactive documentation is automatically generated from our codebase and stays current with the latest features and endpoints.


    ## Getting Started


    New to the Skilljar API? Check out these essential resources:


    - **[API Getting Started Guide](https://support.gainsight.com/Skilljar/Develop_and_Customize/API/Getting_started_with_the_Skilljar_API)** - Authentication, basic concepts, and your first API call

    - **[Token-based SSO](https://support.gainsight.com/Skilljar/Develop_and_Customize/Single_Sign_on_(SSO)/Configuring_Token-Based_Single_Sign-On_(SSO))** - Seamlessly integrate user authentication

    - **[Webhooks](https://support.gainsight.com/Skilljar/Develop_and_Customize/API/Using_Webhooks_API)** - Real-time notifications for platform events

    '
tags:
- name: Instructor Led Events > Sessions
paths:
  /v1/ilt-sessions:
    get:
      operationId: ilt_sessions_list
      description: List all ILT sessions.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Instructor Led Events > Sessions
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIltSessionList'
          description: ''
    post:
      operationId: ilt_sessions_create
      description: Create a new ILT session.
      tags:
      - Instructor Led Events > Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IltSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IltSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IltSessionRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IltSession'
          description: ''
  /v1/ilt-sessions/{ilt_session_id}:
    get:
      operationId: ilt_sessions_retrieve
      description: Retrieve details for a specific ILT session.
      parameters:
      - in: path
        name: ilt_session_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Instructor Led Events > Sessions
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IltSession'
          description: ''
    put:
      operationId: ilt_sessions_update
      description: Update an existing ILT session.
      parameters:
      - in: path
        name: ilt_session_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Instructor Led Events > Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IltSessionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IltSessionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IltSessionRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IltSession'
          description: ''
