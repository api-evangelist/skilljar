openapi: 3.2.0
info:
  title: Skilljar Domains > Plans API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Domains > Plans
paths:
  /v1/domains/{domain_name}/plan:
    get:
      operationId: domains_plan_list
      description: 'List all Plans available in the specified Domain.


        Returns a paginated list of Plans, including associated Offer details such as pricing

        and registration information.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Domains > Plans
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlanList'
          description: ''
      summary: Domains plan list
      x-summary-source: derived
  /v1/domains/{domain_name}/plan/{plan_id}:
    get:
      operationId: domains_plan_retrieve
      description: 'Retrieve details for a specific Plan within a Domain.


        Returns detailed information about the Plan, including its title, associated Offers, and registration URLs.'
      parameters:
      - in: path
        name: domain_name
        schema:
          type: string
          pattern: ^[-:\.0-9a-z]+$
        required: true
      - in: path
        name: plan_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Domains > Plans
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
      summary: Domains plan retrieve
      x-summary-source: derived
components:
  schemas:
    Price:
      type: object
      properties:
        amount:
          type: string
          default: '0.00'
        currency_code:
          type: string
          default: USD
    Offer:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        registration_open:
          type: boolean
        registration_url:
          type: string
          readOnly: true
          description: URL used for course registration
        price:
          $ref: '#/components/schemas/Price'
      required:
      - price
      - registration_open
    Plan:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: Known as plan_id within the documentation
        name:
          type: string
          maxLength: 500
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 100
        plan_url:
          type: string
          readOnly: true
        offer:
          allOf:
          - $ref: '#/components/schemas/Offer'
          readOnly: true
        hidden:
          type: boolean
          description: Hidden plans are only visible on the catalog page to associated groups
        short_description:
          type:
          - string
          - 'null'
          maxLength: 300
      required:
      - hidden
      - name
    PaginatedPlanList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
