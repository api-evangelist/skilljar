openapi: 3.2.0
info:
  title: Skilljar Lesson Progress API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Lesson Progress
paths:
  /v1/lesson-progress/{lesson_progress_id}:
    get:
      operationId: lesson_progress_retrieve
      description: 'Retrieve the progress details for a specific lesson progress object.


        Returns the current completion status, timestamps, and other progress information for

        the student''s lesson attempt.'
      parameters:
      - in: path
        name: lesson_progress_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Lesson Progress
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
          description: ''
      summary: Lesson progress retrieve
      x-summary-source: derived
    put:
      operationId: lesson_progress_update
      description: 'Update the progress for a specific lesson progress object.


        Setting `finished_at` indicates the student as finished the content. This will

        also This will also mark the lesson complete unless the lesson requires validation,

        such as a review of proctoring. To un-complete the lesson, set `completed_at` to null.


        Both PUT and PATCH requests perform partial updates.'
      parameters:
      - in: path
        name: lesson_progress_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Lesson Progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonProgressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonProgressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonProgressRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
          description: ''
      summary: Lesson progress update
      x-summary-source: derived
    patch:
      operationId: lesson_progress_partial_update
      description: 'Partially update the progress for a specific lesson progress object.


        Setting `finished_at` indicates the student as finished the content. This will

        also This will also mark the lesson complete unless the lesson requires validation,

        such as a review of proctoring. To un-complete the lesson, set `completed_at` to null.


        Both PUT and PATCH requests perform partial updates.'
      parameters:
      - in: path
        name: lesson_progress_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Lesson Progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLessonProgressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLessonProgressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLessonProgressRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgress'
          description: ''
      summary: Lesson progress partial update
      x-summary-source: derived
components:
  schemas:
    ValidationStatusEnum:
      enum:
      - PASSED
      - FAILED
      type: string
      description: '* `PASSED` - Passed

        * `FAILED` - Failed'
    PatchedLessonProgressRequest:
      type: object
      properties:
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the user finished the lesson content. Setting this field will also mark the lesson complete unless the lesson requires validation, such as a review of proctoring.
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the user completed the lesson.  If null, the user has not completed the lesson.
        success_status:
          description: '''PASSED'', ''FAILED'' or null


            * `PASSED` - Passed

            * `FAILED` - Failed'
          oneOf:
          - $ref: '#/components/schemas/SuccessStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        score:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Score received
        max_score:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Max possible score
        custom_data:
          type:
          - string
          - 'null'
        validation_status:
          description: '''PASSED'', ''FAILED'' or null


            * `PASSED` - Passed

            * `FAILED` - Failed'
          oneOf:
          - $ref: '#/components/schemas/ValidationStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        validation_data:
          description: JSON formatted. Ignored if the lesson does not require validation.
    SuccessStatusEnum:
      enum:
      - PASSED
      - FAILED
      type: string
      description: '* `PASSED` - Passed

        * `FAILED` - Failed'
    LessonProgressRequest:
      type: object
      properties:
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the user finished the lesson content. Setting this field will also mark the lesson complete unless the lesson requires validation, such as a review of proctoring.
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the user completed the lesson.  If null, the user has not completed the lesson.
        success_status:
          description: '''PASSED'', ''FAILED'' or null


            * `PASSED` - Passed

            * `FAILED` - Failed'
          oneOf:
          - $ref: '#/components/schemas/SuccessStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        score:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Score received
        max_score:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Max possible score
        custom_data:
          type:
          - string
          - 'null'
        validation_status:
          description: '''PASSED'', ''FAILED'' or null


            * `PASSED` - Passed

            * `FAILED` - Failed'
          oneOf:
          - $ref: '#/components/schemas/ValidationStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        validation_data:
          description: JSON formatted. Ignored if the lesson does not require validation.
    LessonProgress:
      type: object
      properties:
        view_count:
          type: integer
          readOnly: true
        last_viewed_on:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the user finished the lesson content. Setting this field will also mark the lesson complete unless the lesson requires validation, such as a review of proctoring.
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 formatted datetime string indicating when the user completed the lesson.  If null, the user has not completed the lesson.
        success_status:
          description: '''PASSED'', ''FAILED'' or null


            * `PASSED` - Passed

            * `FAILED` - Failed'
          oneOf:
          - $ref: '#/components/schemas/SuccessStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        score:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Score received
        max_score:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Max possible score
        custom_data:
          type:
          - string
          - 'null'
        validation_status:
          description: '''PASSED'', ''FAILED'' or null


            * `PASSED` - Passed

            * `FAILED` - Failed'
          oneOf:
          - $ref: '#/components/schemas/ValidationStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        validation_data:
          description: JSON formatted. Ignored if the lesson does not require validation.
        id:
          type: string
          readOnly: true
          description: Known as lesson_progress_id within the documentation
    NullEnum:
      enum:
      - null
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: basic
      description: API key authentication using HTTP Basic Auth. Use your API key as the username and leave password empty.
    tokenAuth:
      type: http
      scheme: bearer
