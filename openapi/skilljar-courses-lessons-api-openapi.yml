          minimum: 0
        search_keywords:
          type: string
          maxLength: 5000
        time_seconds:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 500
        tooltip_html:
