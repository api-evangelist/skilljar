openapi: 3.2.0
info:
  title: Skilljar Courses > Lessons API
  version: 1.0.0
  description: The Skilljar API provides comprehensive access to our customer education platform, enabling you to programmatically manage courses, users, enrollments, and more.
tags:
- name: Courses > Lessons
paths:
  /v1/lessons:
    get:
      operationId: lessons_list
      description: 'List all lessons within a specific course.


        Returns a paginated list of lessons for the given course. The `course_id` query parameter is required.'
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Courses > Lessons
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonList'
          description: ''
      summary: Lessons list
      x-summary-source: derived
    post:
      operationId: lessons_create
      description: 'Create a new lesson within a course.


        Allows you to add a new lesson to a course.

        The lesson type and required fields depend on the lesson''s content type.'
      tags:
      - Courses > Lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonRequest'
        required: true
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
      summary: Lessons create
      x-summary-source: derived
  /v1/lessons/{lesson_id}:
    get:
      operationId: lessons_retrieve
      description: 'Retrieve details for a specific lesson.


        Returns all available information about the lesson, including its type, content, and metadata.'
      parameters:
      - in: path
        name: lesson_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Courses > Lessons
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
      summary: Lessons retrieve
      x-summary-source: derived
    put:
      operationId: lessons_update
      description: 'Update an existing lesson.


        Allows you to modify lesson details. Both PUT and PATCH requests perform partial updates.'
      parameters:
      - in: path
        name: lesson_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Courses > Lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonUpdate'
          description: ''
      summary: Lessons update
      x-summary-source: derived
    patch:
      operationId: lessons_partial_update
      description: 'Partially update an existing lesson.


        Allows you to modify one or more fields of a lesson. Both PUT and PATCH requests perform partial updates.'
      parameters:
      - in: path
        name: lesson_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Courses > Lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLessonUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLessonUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLessonUpdateRequest'
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonUpdate'
          description: ''
      summary: Lessons partial update
      x-summary-source: derived
    delete:
      operationId: lessons_destroy
      description: 'Delete a lesson from a course.


        Permanently removes the lesson and its associated content from the course.'
      parameters:
      - in: path
        name: lesson_id
        schema:
          type: string
          pattern: ^[0-9a-z]+$
        required: true
      tags:
      - Courses > Lessons
      security:
      - OrganizationApiKey: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      summary: Lessons destroy
      x-summary-source: derived
components:
  schemas:
    PaginatedLessonList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
    LessonRequest:
      type: object
      description: Lesson Serializer
      properties:
        content_asset_id:
          type:
          - string
          - 'null'
          minLength: 1
          description: Known as content_asset_id within the documentation
        content_html:
          type: string
        content_quiz_id:
          type:
          - string
          - 'null'
          minLength: 1
          description: Known as content_quiz_id within the documentation
        content_web_package_id:
          type:
          - string
          - 'null'
          minLength: 1
          description: Known as content_web_package_id within the documentation
        course_id:
          type: string
          minLength: 1
          description: Known as course_id within the documentation
        description_html:
          type: string
        display_fullscreen:
          type: boolean
        optional:
          type: boolean
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        search_keywords:
          type: string
          maxLength: 5000
        time_seconds:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
        title:
          type: string
          minLength: 1
          maxLength: 500
        tooltip_html:
          type: string
        type:
          $ref: '#/components/schemas/Type8b7Enum'
      required:
      - course_id
      - order
      - title
      - type
    Lesson:
      type: object
      description: Lesson Serializer
