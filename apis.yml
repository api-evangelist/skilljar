aid: skilljar
name: Skilljar
description: >-
  Skilljar is a customer education and external learning management (LMS)
  platform, now part of Gainsight, used to build, publish, and measure training
  academies, courses, learning paths, and certification programs for customers
  and partners. Its REST API provides comprehensive programmatic access to the
  platform: courses and lessons, published courses and catalog pages, learning
  paths, training domains, users and groups, enrollments and progress, quizzes
  and question banks, purchases and promo codes, instructor-led and virtual
  (VILT) training, and real-time webhooks. The published OpenAPI 3.0.3 definition
  covers 160 paths and 340 operations across 420 schemas, with an HTTP Basic
  API-key v1 surface and a newer v2 OAuth 2.0 surface (PKCE, ~89 scopes).
